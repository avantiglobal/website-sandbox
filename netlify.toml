# Netlify build + hosting config (spec 0.1 / 0.2).
# Static export: Next writes the site to `out/`, published as-is.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# --- Security headers --------------------------------------------------------
# Tight CSP: Sveltia does NOT require unsafe-eval / unsafe-inline in script-src
# (spec 0.2). style-src keeps 'unsafe-inline' because Sveltia injects styles.
# connect-src allows the GitHub API + Netlify's OAuth endpoint for the CMS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.github.com https://api.netlify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# The /admin OAuth popup flow breaks under COOP 'same-origin'; scope the
# popup-friendly value to the admin route only (spec 0.2 known gotcha).
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
